<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 Birthday Surprise</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.3;
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }

        .shape1 { width: 300px; height: 300px; background: #0ea5e9; top: 10%; left: 10%; animation-delay: 0s; filter: blur(80px); }
        .shape2 { width: 250px; height: 250px; background: #ff6b9d; bottom: 10%; right: 10%; animation-delay: -5s; filter: blur(80px); }
        .shape3 { width: 200px; height: 200px; background: #c084fc; top: 50%; left: 50%; animation-delay: -10s; filter: blur(80px); }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
        }

        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 1rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 3rem;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .theme-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(30px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 3rem 2rem;
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
            display: block;
            position: relative;
        }

        .theme-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .theme-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .theme-card:hover::before {
            opacity: 1;
        }

        .card-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.5rem;
        }

        .card-desc {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.6;
        }

        .card-tag {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
            margin-top: 1rem;
        }

        .theme-card.math:hover {
            border-color: #0ea5e9;
            box-shadow: 0 20px 40px rgba(14, 165, 233, 0.4);
        }

        .theme-card.designer:hover {
            border-color: #ff6b9d;
            box-shadow: 0 20px 40px rgba(255, 107, 157, 0.4);
        }

        @media (max-width: 768px) {
            .title { font-size: 2rem; }
            .subtitle { font-size: 1rem; }
            .cards { grid-template-columns: 1fr; gap: 1.5rem; }
            .theme-card { padding: 2.5rem 1.5rem; }
            .card-icon { font-size: 3rem; }
            .card-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="floating-shape shape1"></div>
        <div class="floating-shape shape2"></div>
        <div class="floating-shape shape3"></div>
    </div>

    <div class="container">
        <h1 class="title">🎉 生日快樂！</h1>
        <p class="subtitle">選擇妳喜歡的主題，開始一段特別的生日驚喜 ✨</p>

        <div class="cards">
            <a href="math.html" class="theme-card math">
                <div class="card-icon">📐</div>
                <h2 class="card-title">數學主題</h2>
                <p class="card-desc">藍色線條 × 數學符號<br>解開算式獲得幸福通解</p>
                <span class="card-tag">FOR ALICE</span>
            </a>

            <a href="designer.html" class="theme-card designer">
                <div class="card-icon">🎨</div>
                <h2 class="card-title">設計師主題</h2>
                <p class="card-desc">粉嫩可愛 × 網格背景<br>尋找靈感與貓咪的祝福</p>
                <span class="card-tag">FOR SOPHIE</span>
            </a>
        </div>
    </div>
</body>
</html>
